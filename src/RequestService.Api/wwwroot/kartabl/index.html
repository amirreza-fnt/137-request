<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>کنسول تماس ۱۳۷</title>
  <style>
    :root { --bg:#eef2f6; --card:#fff; --line:#d0d7e2; --text:#182230; --muted:#667085; --ok:#0b6e4f; --bad:#b42318; --warn:#b54708; --ring:#175cd3; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Tahoma,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width: 1100px; margin:0 auto; padding:16px; }
    h1 { margin:0 0 4px; font-size:1.3rem; }
    .muted { color:var(--muted); font-size:.9rem; }
    .err { color:var(--bad); white-space:pre-wrap; }
    .grid { display:grid; gap:12px; grid-template-columns: 340px 1fr; }
    @media (max-width:900px){ .grid{ grid-template-columns:1fr; } }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
    .status-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0 14px; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; font-size:.82rem; background:#e8f5ef; color:var(--ok); }
    .pill.bad { background:#fef3f2; color:var(--bad); }
    .pill.warn { background:#fff4e5; color:var(--warn); }
    .pill.ring { background:#eff8ff; color:var(--ring); }
    .big { font-size:1.6rem; font-weight:700; margin:8px 0; }
    button { font:inherit; padding:10px 14px; border-radius:10px; border:1px solid var(--ok); background:var(--ok); color:#fff; cursor:pointer; }
    button.secondary { background:#fff; color:var(--text); border-color:var(--line); }
    button.danger { background:var(--bad); border-color:var(--bad); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th,td { border:1px solid var(--line); padding:8px; text-align:right; vertical-align:top; }
    th { background:#f5f7fa; }
    audio { width:100%; max-width:280px; display:block; margin-top:8px; }
    .call-card { border:2px solid var(--ring); background:#f5faff; border-radius:12px; padding:12px; margin-top:10px; }
    .empty { text-align:center; color:var(--muted); padding:18px; }
    .agent-row { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); }
    .phone-panel { border:1px dashed var(--line); border-radius:10px; padding:10px; margin-top:10px; background:#fafbfc; }
  </style>
  <script src="vendor/jssip.min.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>کنسول تماس ۱۳۷</h1>
    <p class="muted">جواب و مکالمه داخل همین صفحه (WebRTC). صفحه را حتماً با <b>HTTPS</b> باز کنید و اجازه میکروفون بدهید. ضبط/ثبت تماس مثل قبل خودکار است.</p>

    <div class="status-bar">
      <span id="webrtcStatus" class="pill warn">WebRTC: در حال اتصال...</span>
      <span id="queueStatus" class="pill">صف ۸۰۰۲: —</span>
      <span id="clock" class="muted"></span>
      <button type="button" id="btnRefresh" class="secondary">بروزرسانی</button>
      <button type="button" id="btnHangupCall" class="danger" disabled>قطع مکالمه</button>
    </div>
    <p id="error" class="err"></p>

    <div class="grid">
      <section class="card">
        <h2 style="margin:0 0 8px;font-size:1.05rem">صف زنده</h2>
        <div class="big"><span id="waitingCount">0</span> تماس منتظر</div>
        <div class="muted" id="agentsSummary">کارشناس آنلاین: —</div>
        <div id="agentsBox" style="margin-top:10px"></div>
        <div id="callsBox"></div>
        <div class="phone-panel">
          <div class="muted">صوت تماس جاری</div>
          <audio id="remoteAudio" autoplay playsinline></audio>
        </div>
        <audio id="ringTone" preload="auto" loop>
          <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav" />
        </audio>
      </section>

      <section class="card">
        <h2 style="margin:0 0 8px;font-size:1.05rem">سابقه تماس‌ها</h2>
        <table>
          <thead>
            <tr><th>#</th><th>رهگیری</th><th>شماره</th><th>نتیجه</th><th>زمان</th><th>صوت</th></tr>
          </thead>
          <tbody id="rows"><tr><td colspan="6" class="empty">در حال بارگذاری...</td></tr></tbody>
        </table>
      </section>
    </div>
  </div>

  <script>
    const API_KEY = "dev-internal-key-137";
    const headers = () => ({
      "X-Api-Key": API_KEY,
      "Accept": "application/json",
      "Content-Type": "application/json"
    });

    const el = (id) => document.getElementById(id);
    let lastWaiting = 0;
    let agentExt = "2101";
    let phoneCfg = null;
    let ua = null;
    let currentSession = null;
    let webrtcReady = false;
    let autoAnswer = true;

    function outcomeFa(code) {
      return ({ ANSWERED: "پاسخ داده شد", NO_ANSWER: "بدون پاسخ" })[code] || code || "—";
    }
    function formatTime(utc) {
      try { return new Date(utc).toLocaleString("fa-IR"); } catch { return utc || "—"; }
    }
    function audioCell(item) {
      const file = (item.files || [])[0];
      if (!file || !file.listenUrl) return '<span class="muted">—</span>';
      let url = file.listenUrl;
      if (url.startsWith("/api/v1/demo/")) url += (url.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(API_KEY);
      return '<audio controls preload="none" src="' + url + '"></audio>';
    }

    function setWebRtcStatus(text, cls) {
      el("webrtcStatus").textContent = text;
      el("webrtcStatus").className = "pill" + (cls ? " " + cls : "");
    }

    function attachRemote(session) {
      const audio = el("remoteAudio");
      session.connection.addEventListener("addstream", function (e) {
        audio.srcObject = e.stream;
        audio.play().catch(function () {});
      });
      session.connection.addEventListener("track", function (e) {
        if (!audio.srcObject) audio.srcObject = new MediaStream();
        audio.srcObject.addTrack(e.track);
        audio.play().catch(function () {});
      });
    }

    function bindSession(session) {
      currentSession = session;
      el("btnHangupCall").disabled = false;
      setWebRtcStatus("WebRTC: در تماس", "ring");
      attachRemote(session);
      session.on("ended", function () {
        currentSession = null;
        el("btnHangupCall").disabled = true;
        el("remoteAudio").srcObject = null;
        setWebRtcStatus(webrtcReady ? "WebRTC: آماده" : "WebRTC: قطع", webrtcReady ? "" : "bad");
      });
      session.on("failed", function () {
        currentSession = null;
        el("btnHangupCall").disabled = true;
        el("remoteAudio").srcObject = null;
        setWebRtcStatus(webrtcReady ? "WebRTC: آماده" : "WebRTC: خطا", webrtcReady ? "warn" : "bad");
      });
    }

    async function initWebRtc() {
      if (typeof JsSIP === "undefined") {
        setWebRtcStatus("WebRTC: کتابخانه JsSIP لود نشد", "bad");
        return;
      }
      if (!window.isSecureContext && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        setWebRtcStatus("WebRTC: صفحه را با HTTPS باز کنید", "bad");
        el("error").textContent = "میکروفون مرورگر فقط روی HTTPS کار می‌کند (مثلاً دامنه nginx کارتابل).";
        return;
      }

      const res = await fetch("/api/v1/phone-calls/config", { headers: headers() });
      const cfg = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(cfg.message || ("config HTTP " + res.status));
      phoneCfg = cfg;
      agentExt = cfg.agentExten || "2101";

      if (!cfg.webrtc || !cfg.webrtc.enabled) {
        setWebRtcStatus("WebRTC: در Telephony تنظیم نشده", "bad");
        el("error").textContent = "WssUrl / SipUsername / SipPassword را در appsettings ست کنید.";
        return;
      }

      const w = cfg.webrtc;
      const socket = new JsSIP.WebSocketInterface(w.wssUrl);
      const stun = (w.stunServers && w.stunServers.length) ? w.stunServers : ["stun:stun.l.google.com:19302"];
      const configuration = {
        sockets: [socket],
        uri: w.sipUri,
        password: w.sipPassword,
        display_name: "Kartabl-" + (w.sipUsername || agentExt),
        register: true,
        session_timers: false,
        connection_recovery_max_interval: 30,
        connection_recovery_min_interval: 2
      };

      ua = new JsSIP.UA(configuration);
      ua.on("registered", function () {
        webrtcReady = true;
        setWebRtcStatus("WebRTC: آماده (" + (w.sipUsername || agentExt) + ")", "");
      });
      ua.on("unregistered", function () {
        webrtcReady = false;
        setWebRtcStatus("WebRTC: خارج از ثبت", "warn");
      });
      ua.on("registrationFailed", function (e) {
        webrtcReady = false;
        setWebRtcStatus("WebRTC: رجیستر ناموفق", "bad");
        el("error").textContent = "رجیستر WebRTC ناموفق: " + (e && e.cause ? e.cause : "unknown");
      });
      ua.on("newRTCSession", function (data) {
        const session = data.session;
        if (session.direction !== "incoming") return;
        bindSession(session);
        if (autoAnswer) {
          session.answer({
            mediaConstraints: { audio: true, video: false },
            pcConfig: { iceServers: stun.map(function (u) { return { urls: u }; }) }
          });
        }
      });
      ua.start();
    }

    async function loadHistory() {
      const res = await fetch("/api/v1/phone-calls", { headers: headers() });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || data.error || ("سابقه تماس: HTTP " + res.status));
      const items = Array.isArray(data) ? data : [];
      if (!items.length) {
        el("rows").innerHTML = '<tr><td colspan="6" class="empty">تماسی ثبت نشده</td></tr>';
        return;
      }
      el("rows").innerHTML = items.map((item, i) => {
        const phone = item.citizenPhone || item.createdBySourcePhone || "—";
        const badge = item.outcome === "ANSWERED" ? "pill" : "pill warn";
        return "<tr>"
          + "<td>" + (i + 1) + "</td>"
          + "<td><b>" + (item.trackingCode || "—") + "</b></td>"
          + "<td>" + phone + "</td>"
          + "<td><span class='" + badge + "'>" + outcomeFa(item.outcome) + "</span></td>"
          + "<td>" + formatTime(item.createdAtUtc) + "</td>"
          + "<td>" + audioCell(item) + "</td>"
          + "</tr>";
      }).join("");
    }

    async function loadLive() {
      const res = await fetch("/api/v1/phone-calls/live", { headers: headers() });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || data.error || ("صف زنده: HTTP " + res.status));
      if (data.ok === false || data.configured === false) {
        el("queueStatus").textContent = "صف ۸۰۰۲: قطع ارتباط";
        el("queueStatus").className = "pill bad";
        el("agentsSummary").textContent = data.message || "Telephony/Bridge را روی سرور چک کنید";
        el("agentsBox").innerHTML = "";
        el("callsBox").innerHTML = '<div class="empty">اتصال به ایزابل برقرار نیست</div>';
        throw new Error(data.message || "اتصال به IssabelBridge برقرار نیست");
      }

      const members = data.members || [];
      const callers = data.callers || [];
      const online = typeof data.membersOnline === "number"
        ? data.membersOnline
        : members.filter(m => m.online).length;
      const total = typeof data.membersTotal === "number" ? data.membersTotal : members.length;
      const waiting = typeof data.waiting === "number" ? data.waiting : callers.length;

      el("waitingCount").textContent = String(waiting);
      el("agentsSummary").textContent = "کارشناس آنلاین در صف: " + online + " از " + (total || "؟");
      el("queueStatus").textContent = "صف ۸۰۰۲ — منتظر: " + waiting + " | آنلاین: " + online;
      el("queueStatus").className = waiting > 0 ? "pill ring" : "pill";

      if (!members.length) {
        el("agentsBox").innerHTML = '<div class="muted">اعضای صف از AMI خوانده شد (صدا از WebRTC داخلی ' + agentExt + ').</div>';
      } else {
        el("agentsBox").innerHTML = members.map(m => {
          const cls = m.online ? "pill" : "pill bad";
          return '<div class="agent-row"><span>داخلی ' + m.exten + '</span><span class="' + cls + '">' + (m.status || "") + "</span></div>";
        }).join("");
      }

      if (!callers.length) {
        el("callsBox").innerHTML = '<div class="empty">تماس منتظری در صف نیست</div>';
      } else {
        el("callsBox").innerHTML = callers.map((c, idx) => {
          const ch = c.channel || "";
          return '<div class="call-card">'
            + "<div><b>تماس ورودی #" + (idx + 1) + "</b></div>"
            + "<div class='muted'><code>" + ch + "</code></div>"
            + '<div class="actions">'
            + '<button type="button" data-act="answer" data-ch="' + ch.replace(/"/g, "") + '">جواب در کارتابل</button>'
            + '<button type="button" class="danger" data-act="reject" data-ch="' + ch.replace(/"/g, "") + '">قطع / رد</button>'
            + '</div><div class="muted" style="margin-top:6px;font-size:.8rem">صدا داخل مرورگر (داخلی ' + agentExt + ') پخش می‌شود.</div></div>';
        }).join("");
      }

      try {
        if (waiting > lastWaiting) el("ringTone").play().catch(function () {});
        if (waiting === 0) el("ringTone").pause();
      } catch (_) {}
      lastWaiting = waiting;
      el("clock").textContent = new Date().toLocaleTimeString("fa-IR");
    }

    async function control(action, channel) {
      if (action === "answer" && !webrtcReady) {
        throw new Error("اول WebRTC باید آماده (ثبت‌نام) شود.");
      }
      autoAnswer = true;
      const res = await fetch("/api/v1/phone-calls/control", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ action: action, channel: channel, exten: agentExt, context: "from-internal" })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.message || data.error || ("کنترل ناموفق " + res.status));
      await loadLive();
    }

    el("callsBox").addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button[data-act]");
      if (!btn) return;
      btn.disabled = true;
      el("error").textContent = "";
      try { await control(btn.getAttribute("data-act"), btn.getAttribute("data-ch")); }
      catch (e) { el("error").textContent = e.message || String(e); }
      finally { btn.disabled = false; }
    });

    el("btnHangupCall").addEventListener("click", function () {
      try {
        if (currentSession) currentSession.terminate();
      } catch (_) {}
    });

    async function refreshAll() {
      el("error").textContent = "";
      const errs = [];
      try { await loadLive(); } catch (e) { errs.push(e.message || String(e)); }
      try { await loadHistory(); } catch (e) { errs.push(e.message || String(e)); }
      if (errs.length) el("error").textContent = errs.join("\n");
    }

    el("btnRefresh").addEventListener("click", refreshAll);

    (async function boot() {
      try { await initWebRtc(); }
      catch (e) {
        setWebRtcStatus("WebRTC: خطا", "bad");
        el("error").textContent = e.message || String(e);
      }
      refreshAll();
      setInterval(refreshAll, 5000);
    })();
  </script>
</body>
</html>
