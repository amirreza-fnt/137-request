# Request Service - Reverse Proxy
# apiweb-137request.sabzevar.ir -> Kestrel on 127.0.0.1:5050

# Global tuning
worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';

    access_log /var/log/nginx/requestservice-access.log main;
    error_log  /var/log/nginx/requestservice-error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    upstream requestservice {
        server 127.0.0.1:5050;
        keepalive 64;
    }

    # ======================================================================
    # apiweb-137request.sabzevar.ir — main host
    # ======================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name apiweb-137request.sabzevar.ir;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name apiweb-137request.sabzevar.ir;

        ssl_certificate     /etc/letsencrypt/live/apiweb-137request.sabzevar.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/apiweb-137request.sabzevar.ir/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Attachment lists are small (ids only) — no large body needed.
        client_max_body_size 1m;

        location / {
            proxy_pass http://requestservice;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
