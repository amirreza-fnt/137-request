# Request Service - Reverse Proxy (sites-available snippet)
# https://apiweb-137request.sabzevar.ir:5007  ->  Kestrel on 127.0.0.1:5006
#
# Place at: /etc/nginx/sites-available/apiweb-137request  + symlink into sites-enabled

upstream requestservice {
    server 127.0.0.1:5006;
    keepalive 64;
}

# HTTP -> HTTPS redirect (to port 5007)
server {
    listen 80;
    listen [::]:80;
    server_name apiweb-137request.sabzevar.ir;
    return 301 https://$host:5007$request_uri;
}

# HTTPS on port 5007
server {
    listen 5007 ssl http2;
    listen [::]:5007 ssl http2;
    server_name apiweb-137request.sabzevar.ir;

    ssl_certificate     /etc/letsencrypt/live/apiweb-137request.sabzevar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apiweb-137request.sabzevar.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Attachment lists are small (ids only) — no large body needed.
    client_max_body_size 1m;

    # WebRTC / PJSIP WSS → Issabel (same-origin تا Chrome Private Network Access قطع نکند)
    # مرورگر: wss://apiweb-...:5007/asterisk-wss/ws  →  https://192.168.1.70:8089/ws
    location /asterisk-wss/ {
        proxy_pass https://192.168.1.70:8089/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://requestservice;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
